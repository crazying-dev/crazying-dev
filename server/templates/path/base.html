<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林的窝</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link rel="preload" href="//assets.crazying-dev.top/JS/BeforBody.js" as="script">
    <link rel="preload" href="//assets.crazying-dev.top/JS/AfterBody.js" as="script">
    <link rel="preload" href="//assets.crazying-dev.top/font/CEFFontsCJK.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="//assets.crazying-dev.top/CSS/all.css">
    <script src="//assets.crazying-dev.top/JS/BeforBody.js"></script>

    <link rel="preconnect" href="//assets.crazying-dev.top" crossorigin>
    <link rel="preconnect" href="//img.crazying-dev.top" crossorigin>
    <link rel="preconnect" href="//api.crazying-dev.top" crossorigin>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">

    <!-- navifox 风格覆盖样式 -->
    <style>
        /* 字体改为系统无衬线 */
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif !important;
            color: #333 !important;
        }
        body { background: #f5f5f4 !important; min-width: auto !important; }

        /* 背景层弱化 */
        .bg-box { filter: brightness(0.95) !important; transform: none !important; opacity: 0.15 !important; }

        /* 头部 hero 区域 */
        header {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 48px 20px 24px !important;
            height: auto !important;
            text-align: center !important;
        }
        #Go-to-Github {
            height: 80px !important;
            width: 80px !important;
            border-radius: 50% !important;
            overflow: hidden !important;
            flex-shrink: 0 !important;
        }
        #me {
            width: 80px !important;
            height: 80px !important;
            margin: 0 !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            display: block !important;
            border: 3px solid rgba(255,255,255,0.6) !important;
        }
        .HeaderButton {
            display: inline-flex !important;
            height: auto !important;
            margin: 0 14px !important;
            font-size: 15px !important;
            color: #555 !important;
            transition: color 0.2s ease !important;
            text-decoration: none !important;
        }
        .HeaderButton:hover { color: #000 !important; }
        #title {
            display: block !important;
            position: relative !important;
            right: auto !important;
            font-size: 28px !important;
            font-weight: 600 !important;
            margin-top: 14px !important;
            margin-bottom: 16px !important;
            color: #1a1a1a !important;
            opacity: 1 !important;
            visibility: visible !important;
            letter-spacing: 2px !important;
        }
        .header-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* 主内容区域 */
        #ui {
            max-width: 1100px !important;
            margin: 0 auto !important;
            padding: 10px 20px 40px !important;
        }

        /* 卡片基础样式覆盖 */
        .pc, .all {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
            border-radius: 12px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06) !important;
            color: #333 !important;
        }

        /* 页面标题容器 */
        .mywriter-container {
            max-width: 820px !important;
            margin: 30px auto !important;
            padding: 32px 40px !important;
            background: rgba(255, 255, 255, 0.92) !important;
            border-radius: 14px !important;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06) !important;
        }
        .mywriter-title-box { text-align: center !important; margin-bottom: 28px !important; padding-bottom: 18px !important; border-bottom: 1px solid rgba(0,0,0,0.08) !important; }
        .mywriter-title-box h1 { font-size: 28px !important; color: #1a1a1a !important; font-weight: 600 !important; }
        .mywriter-subtitle { font-size: 14px !important; color: #888 !important; }

        /* 卡片组件颜色调整 */
        .work-card { background: rgba(245, 245, 244, 0.9) !important; border: 1px solid rgba(0,0,0,0.08) !important; }
        .work-card:hover { background: rgba(235, 235, 234, 0.95) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.08) !important; }
        .work-name { color: #333 !important; }
        .work-link.running .work-name { color: #1a1a1a !important; }
        .work-link.stopped .work-name { color: #888 !important; }

        #MusicPcCard, #calendarBox, #PostsList, #MyPcCard {
            background: rgba(255, 255, 255, 0.9) !important;
            color: #333 !important;
        }
        #calendarBox { background: rgba(250, 250, 249, 0.95) !important; box-shadow: none !important; }
        #ymText { color: #333 !important; }
        #weekRow { color: #999 !important; }
        .cal-date { color: #555 !important; }
        .cal-today { background: rgba(100, 116, 139, 0.2) !important; color: #333 !important; }

        /* 按钮样式 */
        .work-btn.active { background: #475569 !important; color: #fff !important; border-color: #475569 !important; }
        .work-btn.active:hover { background: #334155 !important; box-shadow: 0 2px 6px rgba(0,0,0,0.15) !important; }
        .work-btn.disabled { background: #e5e5e5 !important; color: #aaa !important; border-color: #ddd !important; }

        /* 文章列表 */
        #PostsList .posts-header h1 { color: #333 !important; }
        .post-card { background: rgba(245, 245, 244, 0.8) !important; border: 1px solid rgba(0,0,0,0.06) !important; }
        .post-card:hover { background: rgba(238, 238, 236, 0.95) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.08) !important; }
        .post-title { color: #333 !important; }
        .post-text { color: #666 !important; }
        .posts-body::-webkit-scrollbar-thumb { background: rgba(100,100,100,0.2) !important; }

        /* 关于我 */
        .aboutme-wrapper { font-family: 'CEFFontsCJK', sans-serif !important; }
        .aboutme-panel { background: rgba(210, 210, 210, 0.8) !important; }
        .AboutMebutton { background: rgba(255,255,255,0.25) !important; border-color: rgba(255,255,255,0.35) !important; color: #333 !important; }
        .aboutme-sidebar-list a { color: #555 !important; }
        .aboutme-sidebar-list a:hover { background: rgba(0,0,0,0.05) !important; color: #222 !important; }

        /* 联系我 */
        .contact-section-title { color: #475569 !important; border-bottom: 1px solid rgba(71, 85, 105, 0.15) !important; }
        .contact-item { background: rgba(248, 250, 252, 0.8) !important; border: 1px solid rgba(0,0,0,0.06) !important; }
        .contact-item:hover { background: rgba(241, 245, 249, 0.95) !important; border-color: rgba(71,85,105,0.2) !important; }
        .contact-icon { background: rgba(71, 85, 105, 0.1) !important; }
        .contact-icon svg { fill: #475569 !important; }
        .contact-name { color: #888 !important; }
        .contact-value { color: #333 !important; }
        .contact-form-box { background: rgba(248, 250, 252, 0.6) !important; border: 1px solid rgba(0,0,0,0.06) !important; }
        .contact-form-input, .contact-form-textarea { background: rgba(255,255,255,0.8) !important; border: 1px solid #ddd !important; color: #333 !important; }
        .contact-form-input:focus, .contact-form-textarea:focus { border-color: #6b7280 !important; box-shadow: 0 0 0 3px rgba(107,114,128,0.1) !important; }
        .contact-form-submit { background: #475569 !important; color: #fff !important; }
        .contact-form-submit:hover:not(:disabled) { background: #334155 !important; }
        .contact-tips-box { background: rgba(248, 250, 252, 0.5) !important; border: 1px solid rgba(0,0,0,0.06) !important; }
        .contact-tips-box p { color: #777 !important; }

        /* 友人 */
        .friend-card { background: rgba(248, 250, 252, 0.8) !important; border: 1px solid rgba(0,0,0,0.06) !important; }
        .friend-card:hover { background: rgba(241, 245, 249, 0.95) !important; border-color: rgba(71,85,105,0.15) !important; }
        .friend-name { color: #333 !important; }
        .friend-about { color: #777 !important; }
        .friend-site { background: rgba(71,85,105,0.1) !important; color: #475569 !important; }
        .friend-site:hover { background: rgba(71,85,105,0.2) !important; }
        .friend-loading, .friend-empty { color: #999 !important; }

        /* 隐私 */
        .privacy-heading { color: #1a1a1a !important; border-left-color: #475569 !important; }
        .privacy-text { color: #555 !important; }
        .privacy-text a { color: #475569 !important; }
        .privacy-text a:hover { color: #334155 !important; }
        .privacy-list { color: #555 !important; }
        .privacy-last { color: #aaa !important; }

        /* footer */
        footer {
            background: rgba(255, 255, 255, 0.8) !important;
            color: #666 !important;
            border-top: 1px solid rgba(0,0,0,0.06) !important;
            backdrop-filter: blur(10px) !important;
        }
        footer a { color: #475569 !important; transition: color 0.2s ease !important; }
        footer a:hover { color: #1a1a1a !important; }

        /* 响应式 */
        @media (max-width: 760px) {
            .HeaderButton { margin: 0 8px !important; font-size: 14px !important; }
            #title { font-size: 22px !important; }
            .mywriter-container { padding: 20px 16px !important; }
        }
    </style>
</head>
<body>
<!-- 背景图混合 -->
<div class="bg-box-for1 bg-box"></div>

<header>

<!-- B站用户名动态获取 -->
<script>
(function() {
    var biliLink = document.getElementById('FooterBiliName');
    if (!biliLink) return;
    var biliUrl = biliLink.getAttribute('href');
    var apiUrl = '/api/bili-title?url=' + encodeURIComponent(biliUrl);
    fetch(apiUrl)
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data && data.title) {
                biliLink.textContent = data.title;
            }
        })
        .catch(function() {});
})();
</script>

})();
